name: Lake verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Build native source runtime
        run: node scripts/build_zcode_agent.mjs
      - name: Verify Lake and native integration
        run: |
          export PATH="$PWD/bin/zcode:$PWD/third_party/zcode/node_modules/.bin:$PATH"
          pnpm --dir third_party/zcode --filter @zcode/lake test
          pnpm --dir third_party/zcode exec tsx --test apps/zcode-cli/packages/lake/test/native-remote.test.ts
          pnpm --dir third_party/zcode --filter @zcode/lake typecheck
          pnpm --dir third_party/zcode --filter @zcode/lake lint
          pnpm --dir third_party/zcode architecture:check -- --changed
      - name: Verify current frontend
        working-directory: client/desktop/frontend
        run: npm ci && npm test && npm run build
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - run: GOWORK=off go test ./... && GOWORK=off go vet ./...
