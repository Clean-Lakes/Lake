name: Lake verification
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  workbench:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: pnpm --dir web-agent install --frozen-lockfile
      - run: pnpm --dir web-agent test:frontend && pnpm --dir web-agent build:web
      - run: mkdir -p assets/web/dist && cp -R web-agent/web/dist/. assets/web/dist/
      - name: Verify TypeScript production runtime
        run: |
          lake_node=$(python3 scripts/prepare_typescript_runtime.py)
          export PATH="$(dirname "$lake_node"):$PATH"
          "$lake_node" third_party/agent-sdk/node_modules/typescript/bin/tsc -p runtime/typescript/tsconfig.json
          "$lake_node" runtime/typescript/build.mjs
          web-agent/node_modules/.bin/tsx --tsconfig runtime/typescript/tsconfig.json --test runtime/typescript/*.test.ts
          "$lake_node" --test runtime/typescript/*.test.cjs
      - run: python3 scripts/check_adk_runtime_boundary.py
      - run: python3 -m unittest discover -s scripts -p 'test_branch_policy.py'
      - run: python3 -m unittest discover -s scripts -p 'test_dev_*py'
      - run: python3 -m unittest discover -s scripts -p 'test_memory_compatibility_tools.py'
      # The full Web package reached its 20-minute suite deadline while still
      # progressing; the then-current durable-store test had run for one second.
      # Keep full coverage and race instrumentation, with a bounded suite budget.
      - run: go test -race -timeout=30m ./... && go vet ./...
      - run: swift run --package-path client/macos --build-system native LakeUpdateTests
      - run: swift run --package-path client/macos --build-system native LakeWindowTests
      - run: swift build --package-path client/macos --build-system native --product LakeDesktop
      - run: python3 scripts/test_lake_macos_installer.py
