name: Windows x86_64 client
on:
  workflow_dispatch:
    inputs:
      compatibility_only:
        description: 'Memory and legacy compatibility only; no packaging'
        required: false
        default: false
        type: boolean
      compatibility_checks:
        description: 'Selected failed/uncompleted stages for an explicitly authorized retry'
        required: false
        default: all
        type: choice
        options: [all, backend-only, native-ui-only, legacy-ui-only, memory-ui-only]
      compatibility_resume:
        description: 'Skip frontend checks only when already passed at the tested source'
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [master]
    paths: ['client/windows/**', 'internal/**', 'cmd/lake/**', 'scripts/build_lake_windows.py', 'scripts/verify_memory_compatibility.py', 'scripts/verify_strategy_learning.py', 'web-agent/**', 'go.mod', 'go.sum', '.github/workflows/windows-client.yml']
permissions:
  contents: read
jobs:
  windows-amd64:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.compatibility_only) ||
      (github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm --dir web-agent install --frozen-lockfile
      - run: pnpm --dir web-agent test:frontend
        if: ${{ !inputs.compatibility_resume }}
      - run: pnpm --dir web-agent build:web
      - run: choco install nsis 7zip --no-progress -y
      - name: Prepare pinned terminal runtime before packaging
        shell: python
        run: |
          import json, os, pathlib, runpy, shutil
          build = runpy.run_path('scripts/build_lake_windows.py')
          shutil.copytree('web-agent/web/dist', 'assets/web/dist', dirs_exist_ok=True)
          lock = json.loads(pathlib.Path('client/windows/runtime-lock.json').read_text())
          cache = pathlib.Path.home() / '.cache/lake/windows-build'
          cache.mkdir(parents=True, exist_ok=True)
          archive = cache / (lock['sha256'] + '.7z.exe')
          build['download'](lock['url'], archive, lock['sha256'])
          seven = build['tool']('7zz', [shutil.which('7z') or '', 'C:/Program Files/7-Zip/7z.exe'])
          runtime = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lake-conpty-runtime'
          build['run']([seven, 'x', '-y', '-o' + str(runtime), archive])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('LAKE_PORTABLE_ROOT=' + str(runtime) + '\n')
      - name: Test Windows locks, SQLite, ACLs and ConPTY
        if: ${{ !inputs.compatibility_resume }}
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go test -v ./internal/web -run '^(TestWindows|TestConsole|TestRemoteShellCwd|TestCommandWaitTimeout|TestConversationFinishesWhenCompleted|TestInteractiveStartupHidesBootstrapTrigger)' -count=1 -timeout 3m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v ./internal/ai -run '^Test(SSHAuthenticationMethodBoundary|StreamCompletion|StreamIdle|Idle|ManualCompaction|CancelIdle|ReloadClears|FirstTurn|OversizedSingle|FailedCompaction|CompactionUses|ToolChildContextFailure|ParentContextFailure)' -count=1 -timeout 1m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/platform -run '^TestSSHFileOption' -count=1 -timeout 1m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./client/windows -skip '^TestWindows(LegacyAssetsRetired|NaturalMemory)InRealWebView$' -count=1 -timeout 1m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Memory, legacy assets and retirement regression
        shell: pwsh
        run: |
          python scripts/verify_memory_compatibility.py --report "${{ runner.temp }}/memory-compatibility-windows.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows legacy exit and memory settings
        shell: pwsh
        env:
          LAKE_COMPAT_REQUIRED_WINDOWS_UI: '1'
          LAKE_COMPAT_WINDOWS_REPORT: ${{ runner.temp }}/legacy-assets-windows-ui.json
          LAKE_MEMORY_REQUIRED_WINDOWS_UI: '1'
          LAKE_MEMORY_WINDOWS_REPORT: ${{ runner.temp }}/memory-windows-ui.json
        run: |
          go test -v ./client/windows -run '^TestWindowsLegacyAssetsRetiredInRealWebView$' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v ./client/windows -run '^TestWindowsNaturalMemoryInRealWebView$' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-compatibility-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/memory-compatibility-windows.json
            ${{ runner.temp }}/legacy-assets-windows-ui.json
            ${{ runner.temp }}/memory-windows-ui.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build installer after native runtime tests
        run: python scripts/build_lake_windows.py --reuse-web
      - name: Prepare the actual packaged desktop for SSH tests
        shell: python
        run: |
          import os, pathlib, zipfile
          version = pathlib.Path('VERSION').read_text().strip()
          package = pathlib.Path('dist/windows') / version / 'x86_64' / f'Lake-{version}-windows-x86_64.zip'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Lake packaged 中文 with spaces'
          with zipfile.ZipFile(package) as archive:
              archive.extractall(output)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('LAKE_TEST_DESKTOP_EXE=' + str(output / 'Lake/Lake.exe') + '\n')
              env.write('LAKE_PORTABLE_ROOT=' + str(output / 'Lake/resources/git') + '\n')
      - name: Test packaged desktop credential helper and bundled SSH
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          if (-not $env:LAKE_TEST_DESKTOP_EXE) { throw 'Packaged desktop path is required for this test' }
          go test -v ./internal/web -run '^TestWindowsPackagedSSHCredentialHelper$' -count=1 -timeout 90s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Identify branch test packages
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        shell: python
        run: |
          import json, os, pathlib, subprocess
          version = pathlib.Path('VERSION').read_text().strip()
          output = pathlib.Path('dist/windows') / version / 'x86_64'
          metadata = {
              'test_only': True,
              'version': version,
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'pull_request_head': '${{ github.event.pull_request.head.sha }}',
              'run_url': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }
          (output / 'test-build.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          (output / 'TEST-BUILD.txt').write_text(
              'Lake Windows x64 TEST BUILD\n'
              'This artifact is for validation only; it is not a formal release.\n'
              f'Source: {metadata["source_commit"]}\nRun: {metadata["run_url"]}\n'
              'The embedded version remains unchanged. Prefer testing the ZIP in a separate folder.\n'
              'To isolate data, set LAKE_HOME to a dedicated test directory before launching Lake.exe.\n'
              'Do not run the installer over a production installation unless explicitly intended.\n',
              encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/master') && format('Lake-windows-x86_64-test-{0}', github.run_id) || 'Lake-windows-x86_64' }}
          path: dist/windows/*/x86_64/*
          if-no-files-found: error
          retention-days: 14

  memory-compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility_only
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm --dir web-agent install --frozen-lockfile
      - run: pnpm --dir web-agent check
        if: ${{ !inputs.compatibility_resume }}
      - run: pnpm --dir web-agent test:frontend
        if: ${{ !inputs.compatibility_resume }}
      - run: pnpm --dir web-agent build:web
      - name: Stage actual application assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/web/dist | Out-Null
          Copy-Item web-agent/web/dist/* assets/web/dist/ -Recurse -Force
      - name: Memory, legacy assets, retirement and recovery
        if: inputs.compatibility_checks == 'all' || inputs.compatibility_checks == 'backend-only'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          python scripts/verify_memory_compatibility.py --report "${{ runner.temp }}/memory-compatibility-windows.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows legacy confirmation
        if: inputs.compatibility_checks != 'backend-only' && inputs.compatibility_checks != 'memory-ui-only'
        shell: pwsh
        env:
          LAKE_COMPAT_REQUIRED_WINDOWS_UI: '1'
          LAKE_COMPAT_WINDOWS_REPORT: ${{ runner.temp }}/legacy-assets-windows-ui.json
        run: go test -v ./client/windows -run '^TestWindowsLegacyAssetsRetiredInRealWebView$' -count=1 -timeout=3m
      - name: Actual Windows memory settings
        if: inputs.compatibility_checks != 'backend-only' && inputs.compatibility_checks != 'legacy-ui-only'
        shell: pwsh
        env:
          LAKE_MEMORY_REQUIRED_WINDOWS_UI: '1'
          LAKE_MEMORY_WINDOWS_REPORT: ${{ runner.temp }}/memory-windows-ui.json
        run: go test -v ./client/windows -run '^TestWindowsNaturalMemoryInRealWebView$' -count=1 -timeout=3m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-compatibility-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/memory-compatibility-windows.json
            ${{ runner.temp }}/legacy-assets-windows-ui.json
            ${{ runner.temp }}/memory-windows-ui.json
          if-no-files-found: warn
          retention-days: 14
