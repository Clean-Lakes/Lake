services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lake_fixture
      POSTGRES_DB: lake_fixture
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    ports:
      - "127.0.0.1::5432"
secrets:
  pg_password:
    file: .fixtures/pg-password
